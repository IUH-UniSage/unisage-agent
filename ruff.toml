# Ruff configuration for UniSage AI Agent
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"
exclude = [
    ".agents",
    ".github",
    ".venv",
]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # async best practices
    "RUF",   # Ruff-specific
]
ignore = [
    "B008",  # Function calls in defaults - required for FastAPI Depends
]

[lint.per-file-ignores]
"tests/**" = ["S101"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
