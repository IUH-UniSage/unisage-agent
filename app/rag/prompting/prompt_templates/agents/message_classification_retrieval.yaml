# AGENT_MESSAGE_CLASSIFICATION_RETRIEVAL_PROMPT
description: "Phần nối thêm vào message_classification khi CHAT_CLASSIFY_WITH_RETRIEVAL bật - classifier viết luôn truy vấn tìm kiếm (HyDE cho SINGLE, sub-query cho MULTI) để QueryTransformationNode không phải gọi LLM lần nữa, và các field `web` mà WebSearchNode ghép thành từ khóa tìm trên website của Trường. Quy tắc rút gọn từ hyde_generator.yaml và multi_query_decomposer.yaml - sửa quy tắc ở đó thì sửa cả ở đây."
template: |
  ## Truy vấn tìm kiếm cho task `academic_advisory` (BẮT BUỘC)
  Mỗi task `academic_advisory` có thêm các field dưới (ví dụ ở trên chỉ minh họa phân loại; output thật luôn có chúng như ví dụ cuối mục này). Task nhãn khác không có.

  ### SINGLE → `standalone_question` + `hyde_passage`
  - `standalone_question`: câu nối tiếp/rút gọn ("còn khóa <khác> thì sao?") → viết lại thành MỘT câu độc lập từ lịch sử: giữ chủ đề và các tiêu chí không đổi (bậc/hệ, khóa/năm học, khối/ngành, cơ sở), chỉ thay tiêu chí vừa nêu. Câu làm rõ không có nội dung hỏi ("ý tôi là...", "sao không trả lời?") → viết lại câu hỏi gần nhất của chính người dùng; lời trợ lý KHÔNG phải nguồn nội dung. Câu đã đủ thì giữ nguyên. KHÔNG tự thêm tiêu chí mà câu hỏi lẫn lịch sử không nhắc, trừ từ hồ sơ và mốc thời gian theo hai mục dưới.
  - `hyde_passage`: MỘT câu (≤30 từ) văn phong văn bản hành chính của Nhà trường, nêu thông tin `standalone_question` cần; chứa nguyên văn mọi từ khóa của nó (chủ đề, bậc/hệ, khóa/năm học, khối/ngành, cơ sở, tên trường như "iuh"), không đổi từ đồng nghĩa, không lan chủ đề, không bịa con số/ngày/điều khoản, không nhắc trợ lý hay hội thoại.

  ### MULTI → `sub_queries`
  2-3 câu hỏi con độc lập, đủ thực thể, không đại từ ("nó", "ngành đó"). Mọi tiêu chí phạm vi người dùng nêu (ngành/khối, bậc/hệ, cơ sở, khóa/năm học) chép vào MỌI câu con, trừ câu con nêu giá trị khác; không chắc → vẫn chép. Giữ nguyên chữ người dùng; không tạo câu con cho nội dung lượt trước.

  ### Hồ sơ sinh viên
  `<student_declared_attributes>` chỉ bổ sung tiêu chí mà câu hỏi VÀ lịch sử không nêu, vào `standalone_question`/`hyde_passage`/câu con (không vào `query`, `web`). Câu hỏi đã nêu ngành/khóa/bậc/cơ sở → giữ giá trị của câu hỏi (hỏi "học phí ngành điện tử", hồ sơ CNTT → vẫn điện tử). Hỏi cho người khác, hoặc nội dung không phụ thuộc ngành/khóa (tin tức, sự kiện, mật khẩu, địa chỉ, liên hệ, quy trình chung) → không thêm hồ sơ.

  ### Mốc thời gian tương đối
  Trạng từ thời gian tương đối → mốc cụ thể theo `<current_time>` trong `standalone_question`/`hyde_passage`/câu con/`web.nam_hoc` (`query` giữ lời người dùng): "mới nhất", "gần đây", "dạo gần đây", "hiện nay", "năm nay" → năm hiện tại; "tháng này/trước/sau" → tháng/năm tương ứng; "học kỳ này", "kỳ này", "năm học này" → học kỳ/năm học hiện tại; "năm ngoái/trước" → năm -1, "năm sau/tới" → năm +1. Không có trạng từ như vậy thì KHÔNG tự thêm năm.
  VD hôm nay 14/10/2026, "Tin tức mới nhất về hội thảo khoa học quốc tế của IUH?" → `standalone_question` "Tin tức về hội thảo khoa học quốc tế của IUH năm 2026", `nam_hoc` "2026".

  ### `web` (mọi task `academic_advisory`)
  Hệ thống tự ghép thành từ khóa tìm trên website của Trường. Field nào không có giá trị thì BỎ hẳn, không ghi `null`.
  SINGLE: `web` là MỘT object. MULTI: `web` là DANH SÁCH object, mỗi object cho đúng một câu hỏi con theo thứ tự `sub_queries` (mỗi câu tìm riêng, không gộp hai chủ đề vào một `subject`).
  - `topics`: 1-2 nhãn, nhãn chính đầu tiên; nhiều nhóm thì ưu tiên `hoc_phi` > `tuyen_sinh` > `lich_thong_bao` > `lien_he_co_so` > còn lại (VD "hạn đóng học phí học kỳ 1" → `["hoc_phi", "lich_thong_bao"]`):
    `hoc_phi` (mức thu, đơn giá tín chỉ, hạn/cách đóng), `tuyen_sinh` (điểm chuẩn, chỉ tiêu, phương thức/tổ hợp, hồ sơ, ngưỡng đầu vào), `lich_thong_bao` (lịch, mốc thời gian, hạn nộp, đợt đăng ký, thông báo mới), `lien_he_co_so` (địa chỉ, điện thoại, email, phòng ban, cơ sở), `quy_che_thu_tuc` (quy chế, điều kiện, thủ tục, đơn từ, học bổng), `chuong_trinh_dao_tao` (chương trình khung, môn học, chuẩn đầu ra), `khac`.
  - `subject`: 2-8 từ khóa nêu đúng thứ cần tìm; không phải câu hỏi, không chứa ngành/bậc/hệ/cơ sở/năm học/tên trường. VD "mức thu học phí", "điểm chuẩn", "lịch đăng ký học phần học kỳ 1", "địa chỉ".
  - `bac_dao_tao`, `he_dao_tao`, `nganh_hoc`, `co_so`: chỉ khi câu hỏi hoặc lịch sử nêu rõ; KHÔNG lấy từ `<student_declared_attributes>`.
  - `nam_hoc`: "YYYY-YYYY" hoặc "YYYY", chỉ khi người dùng nêu năm/năm học hoặc trạng từ thời gian tương đối. Khóa nhập học ("khóa 2024") KHÔNG phải năm học.

  ### Ví dụ output đầy đủ
  User: "Điều kiện nhận học bổng loại giỏi là gì?"
  Output: {"tasks": [{"intent": "academic_advisory", "query": "Điều kiện nhận học bổng loại giỏi là gì?", "routing_mode": "SINGLE", "standalone_question": "Điều kiện nhận học bổng loại giỏi là gì?", "hyde_passage": "Sinh viên được xét cấp học bổng loại giỏi khi đáp ứng điều kiện về điểm trung bình học kỳ và điểm rèn luyện theo quy định.", "web": {"topics": ["quy_che_thu_tuc"], "subject": "điều kiện học bổng loại giỏi"}}], "confidence": 0.95}

  Lịch sử: "- Người dùng: Học phí đại học chính quy khóa 2024 ngành CNTT bao nhiêu?"
  User: "còn khóa 2025 thì sao?"
  Output: {"tasks": [{"intent": "academic_advisory", "query": "còn học phí đại học chính quy khóa 2025 ngành CNTT thì sao?", "routing_mode": "SINGLE", "standalone_question": "Học phí đại học chính quy khóa 2025 ngành CNTT là bao nhiêu?", "hyde_passage": "Mức thu học phí đại học chính quy khóa 2025 ngành CNTT là ... đồng/tín chỉ.", "web": {"topics": ["hoc_phi"], "subject": "mức thu học phí", "bac_dao_tao": "Đại học", "he_dao_tao": "Chính quy", "nganh_hoc": "Công nghệ Thông tin"}}], "confidence": 0.9}

  User: "địa chỉ cơ sở Quảng Ngãi và học phí đại học chính quy"
  Output: {"tasks": [{"intent": "academic_advisory", "query": "địa chỉ cơ sở Quảng Ngãi và học phí đại học chính quy", "routing_mode": "MULTI", "sub_queries": ["Địa chỉ của cơ sở Quảng Ngãi", "Định mức học phí đại học chính quy tại cơ sở Quảng Ngãi"], "web": [{"topics": ["lien_he_co_so"], "subject": "địa chỉ", "co_so": "Quảng Ngãi"}, {"topics": ["hoc_phi"], "subject": "mức thu học phí", "bac_dao_tao": "Đại học", "he_dao_tao": "Chính quy", "co_so": "Quảng Ngãi"}]}], "confidence": 0.9}

  User: "Tính giúp điểm GPA cho mình và cho mình biết thủ tục đăng ký tốt nghiệp"
  Output: {"tasks": [{"intent": "academic_calculation", "query": "Tính giúp điểm GPA cho mình", "routing_mode": null}, {"intent": "academic_advisory", "query": "Thủ tục đăng ký tốt nghiệp là gì?", "routing_mode": "SINGLE", "standalone_question": "Thủ tục đăng ký tốt nghiệp là gì?", "hyde_passage": "Sinh viên thực hiện thủ tục đăng ký tốt nghiệp bằng cách nộp hồ sơ đăng ký xét tốt nghiệp theo quy định của Nhà trường.", "web": {"topics": ["quy_che_thu_tuc"], "subject": "thủ tục đăng ký xét tốt nghiệp"}}], "confidence": 0.9}
