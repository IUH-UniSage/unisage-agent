# AGENT_MESSAGE_CLASSIFICATION_RETRIEVAL_PROMPT
description: "Phần nối thêm vào message_classification khi CHAT_CLASSIFY_WITH_RETRIEVAL bật - classifier viết luôn truy vấn tìm kiếm (HyDE cho SINGLE, sub-query cho MULTI) để QueryTransformationNode không phải gọi LLM lần nữa, và các field `web` mà WebSearchNode ghép thành từ khóa tìm trên website của Trường. Quy tắc rút gọn từ hyde_generator.yaml và multi_query_decomposer.yaml - sửa quy tắc ở đó thì sửa cả ở đây."
template: |
  ## Truy vấn tìm kiếm cho task `academic_advisory` (BẮT BUỘC)
  Mỗi task `academic_advisory` có thêm các field dưới (ví dụ ở trên chỉ minh họa phân loại; output thật luôn có chúng như ví dụ cuối mục này). Task nhãn khác không có.

  ### SINGLE → `standalone_question` + `hyde_passage` + `hyde_row` (+ `hoc_phan`)
  - `standalone_question`: câu nối tiếp/rút gọn ("còn khóa <khác> thì sao?") → viết lại thành MỘT câu độc lập từ lịch sử: giữ chủ đề và các tiêu chí không đổi (bậc/hệ, khóa/năm học, khối/ngành, cơ sở), chỉ thay tiêu chí vừa nêu. Câu làm rõ không có nội dung hỏi ("ý tôi là...", "sao không trả lời?") → viết lại câu hỏi gần nhất của chính người dùng; lời trợ lý KHÔNG phải nguồn nội dung. Câu đã đủ thì giữ nguyên. KHÔNG tự thêm tiêu chí mà câu hỏi lẫn lịch sử không nhắc, trừ từ hồ sơ và mốc thời gian theo hai mục dưới. Ngành, môn người dùng viết tắt/không dấu → viết đầy đủ, có dấu và GIỮ trong câu ("co khi khoa 16" → "ngành Công nghệ kỹ thuật cơ khí khóa 16", KHÔNG thành "Khoa 16"); viết tắt không chắc nghĩa → giữ nguyên, KHÔNG đoán thành chủ đề khác (VD "XSTK" là môn Xác suất thống kê, không phải "xét tốt nghiệp").
    "Câu hỏi đầy đủ của lượt tra cứu gần nhất" (cuối lịch sử, nếu có) là câu của người dùng đã ghép đủ ngữ cảnh, là GỐC cho câu nối tiếp: tin nhắn CHỈ nêu/sửa tiêu chí ("còn khóa <N>?", "<hệ khác> á") → viết lại câu đó với tiêu chí mới, kể cả khi có `metadata_updates`; câu hỏi đủ ý về chủ đề khác → bỏ qua. Tin nhắn chỉ nêu MỘT đối tượng mới, không tự nói muốn hỏi gì ("thế/còn <X> thì sao", "còn <X>?", "<X> á") → <X> THAY đối tượng CÙNG LOẠI trong câu gốc (học phần/môn, ngành, khóa, hệ, cơ sở, văn bản, đơn vị) và GIỮ NGUYÊN điều đang hỏi cùng mọi đối tượng khác của câu gốc (VD gốc "Học phần tiên quyết của môn Cơ lưu chất là những học phần nào?" + "thế khóa luận tốt nghiệp thì sao" → "Học phần tiên quyết của học phần Khóa luận tốt nghiệp là những học phần nào?"). Chỉ là chủ đề mới khi tin nhắn tự nêu điều muốn hỏi (VD "điều kiện làm khóa luận tốt nghiệp là gì").
  - `hyde_passage`: MỘT câu (≤30 từ) văn phong văn bản hành chính của Nhà trường, nêu thông tin `standalone_question` cần; chứa nguyên văn mọi từ khóa của nó (chủ đề, bậc/hệ, khóa/năm học, khối/ngành, cơ sở, tên trường như "iuh"), không đổi từ đồng nghĩa, không lan chủ đề, không nhắc trợ lý hay hội thoại. Không bịa điều câu hỏi không nêu (con số, ngưỡng điểm, ngày, nơi nộp, phòng ban, kênh): để "..." (VD "nộp hồ sơ gồm ... tại ...").
  - `hoc_phan` (chỉ khi câu hỏi về MỘT học phần/môn học cụ thể: tín chỉ, mã, học trước/tiên quyết/song hành, học kỳ): tên ĐẦY ĐỦ của học phần theo cách gọi trong văn bản, có dấu - "tieng anh 2" → "Tiếng Anh 2", "AV2" → "Anh văn 2", "XSTK" → "Xác suất thống kê", "CTDL&GT" → "Cấu trúc dữ liệu và giải thuật". Viết tắt không chắc nghĩa, hay câu hỏi không về một học phần → bỏ field này, KHÔNG đoán.
  - `hyde_row`: LUÔN viết (hệ thống tìm bằng cả hai, không cần đoán có bảng hay không). MỘT dòng ≤40 từ: "<tên văn bản/bảng> | <thực thể được hỏi> | <tên cột cần tìm> | ...", dùng cách gọi của VĂN BẢN thay lời người dùng, chép NGUYÊN VĂN tên/cột dưới đây; chỉ đổi cách gọi, giữ đúng tiêu chí và người thực hiện của câu hỏi đầy đủ, KHÔNG thêm tiêu chí nó không có (hệ "Đại học chính quy", cơ sở, khóa), không bịa số/mã. Cách gọi đã biết:
    - Biểu học phí: cột "Mức thu 01 tín chỉ", "Mức thu theo năm học"; dòng "Khóa tuyển sinh năm học <YYYY-YYYY>", "Môn lý thuyết", "Môn thực hành"; chia theo khối, không theo ngành → "Khối <Kinh tế|Công nghệ> (ngành <X>)".
    - Chương trình đào tạo: tên ĐỦ "Chương trình đào tạo [<loại chương trình>] ngành <X> khóa <N> năm học <2004+N>-<2005+N>" (K20 → "khóa 20 năm học 2024-2025"); cột "Mã học phần", "Số tín chỉ", "Học phần: học trước(a), tiên quyết(b), song hành(c)" (môn học trước ghi bằng mã).
    - Thủ tục, quy trình <T> (của sinh viên, giảng viên hay cán bộ): "<T> (<người thực hiện>) | Đối tượng/Điều kiện | Hồ sơ kèm theo | Quy trình thực hiện | Thời gian giải quyết".
    - Danh sách (hội đồng, lịch thi, phân công, đề tài): cột theo người/việc, VD "Họ và tên SV", "Tên đề tài", "Giảng viên hướng dẫn", "Ngày thi".

  ### MULTI → `sub_queries`
  2-3 câu hỏi con độc lập, đủ thực thể, không đại từ ("nó", "ngành đó"). Mọi tiêu chí phạm vi người dùng nêu (ngành/khối, bậc/hệ, cơ sở, khóa/năm học) chép vào MỌI câu con, trừ câu con nêu giá trị khác; không chắc → vẫn chép. Giữ nguyên chữ người dùng; không tạo câu con cho nội dung lượt trước.

  ### Người thực hiện thủ tục
  Thủ tục, đơn, biểu mẫu dành cho MỘT đối tượng (sinh viên / giảng viên / cán bộ đơn vị). Câu hỏi về thủ tục, hồ sơ, đơn từ → `standalone_question`, `hyde_passage`, `hyde_row` và câu con ghi rõ NGƯỜI THỰC HIỆN: theo câu hỏi ("cho sinh viên", "lớp tôi dạy", "điểm của sinh viên" → giảng viên; "tôi muốn thi lại", "điểm của tôi" → sinh viên; "đơn vị/phòng tôi" → cán bộ đơn vị), câu hỏi không nói thì theo `<user_role>`. KHÔNG viết "sinh viên hoặc giảng viên". VD `<user_role>` GIANG_VIEN hỏi "bổ sung điểm thường kỳ nộp hồ sơ gì" → `standalone_question` "Giảng viên cần nộp hồ sơ gì để bổ sung điểm thường kỳ cho sinh viên?".

  ### Hồ sơ sinh viên
  `<declared_attributes>` chỉ bổ sung tiêu chí mà câu hỏi VÀ lịch sử không nêu, vào `standalone_question`/`hyde_passage`/`hyde_row`/câu con (không vào `query`, `web`). Câu hỏi đã nêu ngành/khóa/bậc/cơ sở → giữ giá trị của câu hỏi (hỏi "học phí ngành điện tử", hồ sơ CNTT → vẫn điện tử). `<declared_attributes>` là hồ sơ của CHÍNH người hỏi: câu hỏi về người khác (giảng viên/cán bộ hỏi về sinh viên, hỏi giúp bạn, giả định), hoặc nội dung không phụ thuộc thuộc tính của người hỏi (tin tức, sự kiện, mật khẩu, địa chỉ, liên hệ, quy trình chung) → không thêm hồ sơ.

  ### Khóa của IUH
  "K<N>", "khóa <N>" (N có 1-2 chữ số) = nhập học năm 2004 + N (K18 = 2022, K20 = 2024). Trong `standalone_question`/`hyde_passage`/câu con viết "khóa K18 (nhập học 2022)"; TUYỆT ĐỐI KHÔNG viết "khóa 2018" hay "năm 2018". `web.nam_hoc` KHÔNG lấy từ khóa nhập học - chỉ có khóa thì bỏ field này.
  Dòng gộp khóa cũ: biểu phí/quy định theo khóa thường chỉ có dòng riêng cho các khóa gần đây và gộp các khóa cũ vào MỘT dòng "khóa tuyển sinh năm học <X> trở về trước". Khi chủ đề là mức thu/học phí/đơn giá theo khóa và người hỏi nêu một khóa, `hyde_passage` ghi khóa đó dạng "khóa tuyển sinh năm học <YYYY-YYYY>" và thêm "hoặc khóa tuyển sinh năm học trở về trước" để tìm được cả dòng gộp. Không đoán giá trị <X>; không áp dụng cho chủ đề không có biểu theo khóa.

  ### Mốc thời gian tương đối
  Trạng từ thời gian tương đối → mốc cụ thể theo `<current_time>` trong `standalone_question`/`hyde_passage`/câu con/`web.nam_hoc` (`query` giữ lời người dùng): "mới nhất", "gần nhất", "gần đây", "dạo gần đây", "vừa rồi", "vừa qua", "sắp tới", "hiện nay", "hiện tại", "năm nay" → năm hiện tại; "tháng này/trước/sau" → tháng/năm tương ứng; "học kỳ này", "kỳ này", "năm học này" → học kỳ/năm học hiện tại; "năm ngoái/trước" → năm -1, "năm sau/tới" → năm +1. Không có trạng từ như vậy thì KHÔNG tự thêm năm.
  Riêng chủ đề lập theo năm học (học phí, học bổng, kế hoạch/lịch, định mức hay thống kê theo năm học): các trạng từ trên → NĂM HỌC hiện tại ở dòng "Học kỳ hiện tại" (VD "năm học 2026-2027", `nam_hoc` "2026-2027"), không phải năm dương lịch.
  VD hôm nay 14/10/2026, "Tin tức mới nhất về hội thảo khoa học quốc tế của IUH?" → `standalone_question` "Tin tức về hội thảo khoa học quốc tế của IUH năm 2026", `nam_hoc` "2026".

  ### `web` (mọi task `academic_advisory`)
  Hệ thống tự ghép thành từ khóa tìm trên website của Trường. Field nào không có giá trị thì BỎ hẳn, không ghi `null`.
  SINGLE: `web` là MỘT object. MULTI: `web` là DANH SÁCH object, mỗi object cho đúng một câu hỏi con theo thứ tự `sub_queries` (mỗi câu tìm riêng, không gộp hai chủ đề vào một `subject`).
  - `topics`: 1-2 nhãn, nhãn chính đầu tiên; nhiều nhóm thì ưu tiên `hoc_phi` > `tuyen_sinh` > `lich_thong_bao` > `lien_he_co_so` > còn lại (VD "hạn đóng học phí học kỳ I" → `["hoc_phi", "lich_thong_bao"]`):
    `hoc_phi` (mức thu, đơn giá tín chỉ, hạn/cách đóng), `tuyen_sinh` (điểm chuẩn, chỉ tiêu, phương thức/tổ hợp, hồ sơ, ngưỡng đầu vào), `lich_thong_bao` (lịch, mốc thời gian, hạn nộp, đợt đăng ký, thông báo mới), `lien_he_co_so` (địa chỉ, điện thoại, email, phòng ban, cơ sở), `quy_che_thu_tuc` (quy chế, điều kiện, thủ tục, đơn từ, học bổng), `chuong_trinh_dao_tao` (chương trình khung, môn học, chuẩn đầu ra), `khac`.
  - `subject`: 2-8 từ khóa nêu đúng THỨ cần tìm, không phải câu hỏi. VD "mức thu học phí", "điểm chuẩn", "lịch đăng ký học phần học kỳ I", "địa chỉ".
    - TÁCH: thông tin có ô riêng ghi vào ô đó, KHÔNG lặp lại trong `subject`: ngành → `nganh_hoc`, bậc → `bac_dao_tao`, hệ → `he_dao_tao`, cơ sở → `co_so`, năm/năm học → `nam_hoc`; không ghi tên trường. Vẫn ghi vào ô kể cả khi chủ đề không cần (hệ thống tự quyết có dùng hay không). VD "học phí ngành CNTT năm 2026" → `"subject": "mức thu học phí", "nganh_hoc": "Công nghệ Thông tin", "nam_hoc": "2026"`; SAI: `"subject": "mức thu học phí ngành Công nghệ thông tin"`.
    - THUẬT NGỮ CHUẨN như văn bản của Trường, không viết tắt, để cùng một câu hỏi luôn ra cùng một `subject`: "học kỳ I/II/III" (không "hk1", "kỳ 1"); "mức thu học phí" (không "học phí", "mức học phí", "đơn giá tín chỉ"); "hạn đóng học phí" (không "hạn nộp học phí"); "đăng ký học phần" (không "đkhp", "đăng ký môn"); "điểm chuẩn" (không "điểm trúng tuyển"); "chương trình đào tạo", "thời khóa biểu", "ký túc xá", "điểm rèn luyện"; tên phòng đầy đủ ("Phòng Đào tạo", "Phòng Công tác Sinh viên", "Phòng Tài chính - Kế toán").
    - Giữ chữ phân biệt yêu cầu: "điều kiện …" (quy chế) khác "thủ tục …" (thông báo, biểu mẫu); "học lại" khác "học cải thiện"; "miễn giảm học phí", "hoàn trả học phí" khác "mức thu học phí".
  - `bac_dao_tao`, `he_dao_tao`, `nganh_hoc`, `co_so`: chỉ khi câu hỏi hoặc lịch sử nêu rõ; KHÔNG lấy từ `<declared_attributes>`, KHÔNG suy ra (nêu ngành không có nghĩa là bậc "Đại học", không nói hệ thì bỏ `he_dao_tao`).
  - `nam_hoc`: "YYYY-YYYY" hoặc "YYYY", chỉ khi người dùng nêu năm/năm học hoặc trạng từ thời gian tương đối. Khóa nhập học ("khóa 2024") KHÔNG phải năm học.

  ### Ví dụ output đầy đủ
  User: "Điều kiện nhận học bổng loại giỏi là gì?"
  Output: {"tasks": [{"intent": "academic_advisory", "query": "Điều kiện nhận học bổng loại giỏi là gì?", "routing_mode": "SINGLE", "standalone_question": "Điều kiện nhận học bổng loại giỏi là gì?", "hyde_passage": "Sinh viên được xét cấp học bổng loại giỏi khi đáp ứng điều kiện về điểm trung bình học kỳ và điểm rèn luyện theo quy định.", "hyde_row": "Quy định xét cấp học bổng khuyến khích học tập | Loại giỏi | Điểm trung bình học kỳ | Điểm rèn luyện | Điều kiện", "web": {"topics": ["quy_che_thu_tuc"], "subject": "điều kiện học bổng loại giỏi"}}], "confidence": 0.95}

