  Output: {"tasks": [{"intent": "academic_advisory", "query": "Điều kiện nhận học bổng loại giỏi là gì?", "routing_mode": "SINGLE", "standalone_question": "Điều kiện nhận học bổng loại giỏi là gì?", "hyde_passage": "Sinh viên được xét cấp học bổng loại giỏi khi đáp ứng điều kiện về điểm trung bình học kỳ và điểm rèn luyện theo quy định.", "web": {"topics": ["quy_che_thu_tuc"], "subject": "điều kiện học bổng loại giỏi", "bac_dao_tao": null, "he_dao_tao": null, "nganh_hoc": null, "co_so": null, "nam_hoc": null}}], "confidence": 0.95}

