# AGENT_MESSAGE_CLASSIFICATION_RETRIEVAL_PROMPT
description: "Phần nối thêm vào message_classification khi CHAT_CLASSIFY_WITH_RETRIEVAL bật - classifier viết luôn truy vấn tìm kiếm (HyDE cho SINGLE, sub-query cho MULTI) để QueryTransformationNode không phải gọi LLM lần nữa, và các field `web` mà WebSearchNode ghép thành từ khóa tìm trên website của Trường. Quy tắc rút gọn từ hyde_generator.yaml và multi_query_decomposer.yaml - sửa quy tắc ở đó thì sửa cả ở đây."
template: |
  ## Truy vấn tìm kiếm cho task `academic_advisory` (BẮT BUỘC)
  Mỗi task `academic_advisory` có thêm field truy vấn tìm kiếm và field `web`, ngoài `intent`/`query`/`routing_mode` ở trên. Các ví dụ phía trên chỉ minh họa phân loại - output thật luôn có thêm các field này như ví dụ dưới. Task khác nhãn không có các field này.

  ### `routing_mode = "SINGLE"` → `standalone_question` + `hyde_passage`
  - `standalone_question`: nếu câu hỏi là câu nối tiếp/rút gọn (VD "còn khóa <năm học khác> thì sao?"), dùng lịch sử hội thoại viết lại thành MỘT câu hỏi độc lập: giữ CHỦ ĐỀ của lượt trước và các tiêu chí người dùng không đổi (bậc/hệ đào tạo, khóa/năm học, khối/ngành, cơ sở), chỉ thay tiêu chí vừa nêu. Câu phản hồi/làm rõ không chứa nội dung hỏi ("ý tôi là...", "sao không trả lời?") → viết lại đúng câu hỏi gần nhất của chính người dùng trong lịch sử; lời trả lời/từ chối của trợ lý KHÔNG phải nguồn nội dung. Câu hỏi đã đầy đủ thì giữ nguyên. TUYỆT ĐỐI KHÔNG tự thêm khóa/năm học, bậc/hệ, khối/ngành hay cơ sở mà cả câu hỏi lẫn lịch sử đều không nhắc tới.
  - `hyde_passage`: MỘT câu ngắn (tối đa 30 từ) theo văn phong văn bản hành chính của Nhà trường, nêu thông tin mà `standalone_question` cần tìm. PHẢI chứa nguyên văn mọi từ khóa của `standalone_question` (chủ đề, bậc/hệ, khóa/năm học, khối/ngành, cơ sở; tên/viết tắt trường giữ nguyên như "iuh"), không thay bằng từ đồng nghĩa, không lan sang chủ đề không được hỏi, không bịa con số cụ thể (mức tiền, ngày tháng, số điều khoản). Không xin lỗi, không từ chối, không nhắc tới trợ lý hay hội thoại.

  ### `routing_mode = "MULTI"` → `sub_queries`
  - `sub_queries`: 2 đến 3 câu hỏi con độc lập để tìm kiếm song song. Mỗi câu chứa đầy đủ thực thể, không dùng đại từ ("nó", "ngành đó").
  - Mọi tiêu chí phạm vi người dùng nêu (ngành/khối, bậc/hệ, cơ sở/phân hiệu, khóa/năm học) PHẢI chép vào MỌI câu hỏi con, dù chỉ nói một lần; chỉ bỏ khi chính câu hỏi con đó nêu giá trị khác thay thế. Không chắc → vẫn chép.
  - Giữ nguyên chữ người dùng dùng cho chủ đề và tiêu chí. Lịch sử chỉ dùng để hiểu câu nối tiếp, không tạo câu hỏi con cho nội dung lượt trước.

  ### `web` (MỌI task `academic_advisory`, cả SINGLE lẫn MULTI)
  Để tìm trên website của Trường khi kho văn bản không có câu trả lời. Hệ thống tự ghép các field thành từ khóa tìm kiếm và tự thêm năm học hiện tại, nên chỉ điền đúng phần được yêu cầu:
  - `topics`: 1-2 nhãn, nhãn chính đứng đầu:
    - `hoc_phi`: mức thu, đơn giá tín chỉ, hạn/cách đóng học phí;
    - `tuyen_sinh`: điểm chuẩn, chỉ tiêu, phương thức/tổ hợp xét tuyển, hồ sơ, ngưỡng đầu vào;
    - `lich_thong_bao`: lịch, mốc thời gian, hạn nộp, đợt đăng ký, thông báo mới;
    - `lien_he_co_so`: địa chỉ, điện thoại, email, phòng ban, cơ sở/phân hiệu;
    - `quy_che_thu_tuc`: quy chế, điều kiện, thủ tục, đơn từ, điều kiện/mức học bổng;
    - `chuong_trinh_dao_tao`: chương trình khung, môn học, chuẩn đầu ra;
    - `khac`: không thuộc nhóm nào.
    Câu thuộc nhiều nhóm: nhãn chính theo thứ tự ưu tiên `hoc_phi`, `tuyen_sinh`, `lich_thong_bao`, `lien_he_co_so` trước các nhãn còn lại (VD "hạn đóng học phí học kỳ 1" → `["hoc_phi", "lich_thong_bao"]`).
  - `subject`: cụm từ khóa ngắn (2-8 từ) nêu đúng thứ cần tìm, KHÔNG phải câu hỏi, KHÔNG chứa ngành/bậc/hệ/cơ sở/năm học (đã có field riêng), KHÔNG chứa tên trường. VD "mức thu học phí", "điểm chuẩn", "lịch đăng ký học phần học kỳ 1", "địa chỉ", "thời hạn link khôi phục mật khẩu cổng giảng viên".
  - `bac_dao_tao`, `he_dao_tao`, `nganh_hoc`, `co_so`: CHỈ khi câu hỏi hoặc lịch sử hội thoại nêu rõ; KHÔNG lấy từ `<student_profile>`; không có thì `null`.
  - `nam_hoc`: dạng "YYYY-YYYY", CHỈ khi người dùng nêu năm học/năm cụ thể; không nêu thì `null` (hệ thống tự dùng năm học hiện tại). Khóa nhập học ("khóa 2024") KHÔNG phải năm học.

