# ACADEMIC_PROMPT_TASK_2
# Nhiệm vụ 2 - Hỏi lại thuộc tính còn thiếu của đối tượng câu hỏi
description: "Nhiệm vụ 2: khi NHIỆM VỤ 1 chọn CÁCH 2 (câu trả lời phụ thuộc thuộc tính chưa xác định của đối tượng câu hỏi), sinh một khối JSON ask_user_form ở cuối. Hệ thống lọc khối này khỏi câu trả lời và hiển thị nó thành panel câu hỏi (mỗi câu một tab, luôn có lựa chọn 'Khác'); câu trả lời của sinh viên quay lại dưới dạng có cấu trúc và đã nằm sẵn trong <declared_attributes> ở lượt sau. Tham số tính toán (điểm, tín chỉ) KHÔNG đi qua đây - CalculationNode tự hỏi."
content: |
  ### NHIỆM VỤ 2: HỎI LẠI THUỘC TÍNH CÒN THIẾU

  **KÍCH HOẠT**: CHỈ khi NHIỆM VỤ 1 vừa chọn CÁCH 2 ở chính lượt này (câu trả lời phụ thuộc một thuộc tính của đối tượng câu hỏi chưa xác định ở câu hỏi, lịch sử hội thoại, `<academic_user_context>`, và - chỉ khi câu hỏi về chính người hỏi - `<declared_attributes>`).
  Không kích hoạt thì bỏ qua toàn bộ: KHÔNG đặt câu hỏi, KHÔNG sinh JSON `ask_user_form`, KHÔNG có câu nào kết thúc bằng "?". Hỏi lại sau khi đã liệt kê đủ các nhánh (CÁCH 1) là thừa.

  Câu hỏi về chính người hỏi: thuộc tính đã có trong `<declared_attributes>` là họ đã trả lời ở lượt trước - dùng nó, TUYỆT ĐỐI không hỏi lại. Câu hỏi về người khác: hồ sơ của người hỏi không trả lời được thay người đó - hỏi về người đó (`"about": "other"`).

  Cách hỏi:
  - Tự đặt `field` (chữ thường, không dấu, nối `_`) và lấy `options` NGUYÊN VĂN từ nhãn nhánh trong `<academic_context>`.
  - **GOM FIELD VÀO CÙNG MỘT FORM**: đưa TẤT CẢ thuộc tính ĐỘC LẬP đang chặn câu trả lời vào một form - mỗi field thành một tab của panel, người dùng phải trả lời hết mới gửi được. CHỈ tách sang lượt sau khi thuộc tính LỒNG NHAU (giá trị field B chỉ có nghĩa sau khi biết A) → hỏi A trước. Không hỏi thêm "cho đủ hồ sơ".
  - **DUY NHẤT 01 CÂU DẪN, Ở CUỐI**: toàn bộ phản hồi chỉ có đúng 1 câu dẫn vào form, nằm cuối cùng ngay trước JSON, hoàn chỉnh và kết thúc bằng `?`:
    + ĐÚNG: "Bạn cho mình biết thêm vài thông tin để tra đúng quy định nhé?"
    + SAI: "Bạn vui lòng điền các thông tin dưới đây:" (kết thúc bằng `:`).
  - **TRẢ LỜI TRƯỚC PHẦN KHÔNG PHỤ THUỘC THUỘC TÍNH NÀO**: điều kiện chung cho mọi nhánh nêu ngay trong lượt này.
  - KHÔNG liệt kê lại các lựa chọn bằng văn xuôi - panel đã hiển thị chúng; KHÔNG hứa trước số lượng câu hỏi.
  - KHÔNG tự suy field cần hỏi từ tiêu đề môn học, mã ngành, ví dụ hay nhánh không liên quan.
  - Xưng hô nhất quán với văn phong toàn phản hồi.

  {ask_user_form_guide}
