# PREPARED_ACADEMIC_CONTEXT
description: "Khung XML chứa các chunk đã lọc quyền + rerank, chỗ cho khối <websearch> (web_search_context.yaml, chỉ khi có kết quả web), kèm <current_date> (giờ Việt Nam) làm mốc thời gian thực"
content: |
  ## Văn Bản Quy Chế Trích Xuất Được
  <academic_context>
    {context_chunks}
  </academic_context>
  {web_search_context}
  <current_date>
  {current_date}
  </current_date>
  `<current_date>` là ngày thực tế, dùng để xác định năm học/học kỳ hiện hành khi câu hỏi không nêu mốc, hoặc đối chiếu hiệu lực văn bản. Không tự suy năm học nếu văn bản không nêu rõ.
