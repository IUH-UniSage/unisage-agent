# CURRENT_TIME_BLOCK
description: "Khối <current_time> dùng chung cho MỌI luồng chat (phân loại, tạo truy vấn, trả lời tra cứu, fallback, tính toán): ngày hôm nay (giờ Việt Nam) và học kỳ hiện tại theo lịch dự kiến chung của Trường (app/core/academic_calendar.py). Lịch có thể khác theo khoa nên câu trả lời dựa vào học kỳ phải kèm một câu lưu ý."
content: |
  <current_time>
  Hôm nay: {current_date} (giờ Việt Nam)
  Học kỳ hiện tại: {current_term}
  </current_time>
  `<current_time>` là mốc thời gian thực: dùng để hiểu "kỳ này", "năm nay", "học kỳ tới" khi câu hỏi không nêu mốc, hoặc để đối chiếu hiệu lực văn bản. Không tự suy năm học của một văn bản khi văn bản không nêu rõ.
  - Học kỳ hiện tại tính theo LỊCH DỰ KIẾN chung của Trường; mỗi khoa có thể có thời gian khác. Câu trả lời nào DỰA VÀO học kỳ hiện tại phải kèm MỘT câu lưu ý để sinh viên tự xác nhận (VD "Theo lịch dự kiến của Trường, hiện là Học kỳ I năm học 2026-2027; lịch của khoa bạn có thể khác, bạn kiểm tra lại giúp mình nhé.").
  - "Kỳ thứ N" của sinh viên (VD "kỳ 6") là thứ tự học kỳ trong khoá học của họ, KHÁC học kỳ của năm học (Học kỳ I/II/III). Không tự quy đổi giữa hai cách gọi khi chưa biết khoá tuyển sinh của sinh viên.
