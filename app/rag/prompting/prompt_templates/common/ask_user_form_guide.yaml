# ACADEMIC_PROMPT_ASK_USER_FORM_GUIDE
description: "Hướng dẫn tạo JSON ask_user_form khi cần thu thập MỘT hoặc NHIỀU thuộc tính còn thiếu cùng lúc — options có thể đến từ node trước (Calculation/Comparison, nguồn cố định) HOẶC do chính bạn trích nguyên văn từ nhãn nhánh trong văn bản quy chế (nguồn động — xem NHIỆM VỤ 1)."
content: |
  ## ASK_USER_FORM_GUIDE — TẠO JSON FORM THU THẬP THUỘC TÍNH

  Sau khi xác định (các) field cần hỏi theo NHIỆM VỤ 2, BẮT BUỘC gen JSON theo đúng format:

  ```json
  {"type": "ask_user_form", "sub_query_id": "<SQx hoặc bỏ qua>", "fields": [
    {"field": "<FIELD_ID>", "label": "<nhãn hiển thị>", "options": [{"id": "<value>", "label": "<hiển thị>"}]}
  ]}
  ```

  ### Quy tắc chung
  - Chỉ MỘT block ```json duy nhất, đặt ở CUỐI câu trả lời.
  - `fields` là MỘT MẢNG, kể cả khi chỉ có 1 field. Không bao giờ dùng object lẻ.
  - `sub_query_id`: CHỈ thêm khi câu hỏi gốc đã phân rã thành nhiều sub-query (luồng MULTI) — ghi mã sub-query còn thiếu thuộc tính (VD `"SQ2"`). Luồng câu hỏi đơn thì BỎ QUA khoá này.
  - Thứ tự phần tử trong `fields` là thứ tự hiển thị. Đặt thuộc tính quan trọng/dễ trả lời nhất lên đầu.

  ### Quy tắc từng field
  - `field`: nếu có sẵn trong `<missing_metadata_to_confirm>` thì COPY nguyên văn, không sửa. Nếu do bạn tự phát hiện từ văn bản (KLTN không dùng danh sách field tĩnh như hệ thống visa) thì TRƯỚC KHI đặt tên mới, đối chiếu với bảng khái niệm phổ biến bên dưới — trùng khái niệm thì PHẢI dùng đúng tên đã liệt kê, không tự nghĩ tên khác (kể cả khi nghĩ cách diễn đạt khác hay hơn). Đây là nguyên nhân từng khiến cùng một khái niệm "ngành" bị lưu thành hai field khác tên (`nganh_hoc` và `nganh_dao_tao`) ở hai lượt khác nhau, làm `confirmed_metadata` phân mảnh và hỏi lại nhầm. Không trùng khái niệm nào dưới đây thì tự đặt tên mới như bình thường (chữ thường, không dấu, nối bằng `_`, mô tả đúng thuộc tính mà CHÍNH `<academic_context>` lượt này đang phân nhánh theo) — danh sách này chỉ liệt kê các khái niệm phổ biến hay gặp lại, KHÔNG đầy đủ và KHÔNG giới hạn những field được phép hỏi. Một số dòng có ghi chú "hiếm khi hợp lệ" — đó là các thuộc tính gần như không bao giờ thực sự là điều kiện phân nhánh của một văn bản quy chế; chỉ dùng khi CHÍNH văn bản `<academic_context>` lượt này thật sự chia nhánh theo đúng thuộc tính đó, không suy đoán hay hỏi "cho đầy đủ hồ sơ".

    {known_metadata_fields}

    Ngoại lệ duy nhất: quy tắc "HỎI SÂU THÊM MỘT CẤP" ở NHIỆM VỤ 1 (văn bản chia nhánh nhỏ hơn bên trong một giá trị đã biết) vẫn BẮT BUỘC đặt tên field MỚI như hướng dẫn ở đó, không dùng lại tên trong bảng trên.
  - `label`: nhãn ngắn hiển thị cạnh ô nhập, viết theo ngôn ngữ người dùng đang dùng, diễn đạt lại từ đúng thuộc tính đó.
  - ⚠️ TÊN FIELD PHẢI ĐẾN TỪ VĂN BẢN, KHÔNG PHẢI TỪ VÍ DỤ: các ví dụ bên dưới chỉ minh hoạ ĐỊNH DẠNG JSON. Nếu bạn sắp viết một tên field mà `<academic_context>` lượt này không hề đề cập tới thuộc tính đó, bạn đang chép lại ví dụ chứ không đọc văn bản — đó là lỗi nghiêm trọng, tạo ra câu hỏi vô nghĩa cho người dùng.
  - `options`:
    + Nguồn là node trước (Calculation/Comparison) → COPY nguyên văn, CẤM sửa/dịch/bịa thêm.
    + Nguồn là văn bản → COPY nguyên văn nhãn nhánh xuất hiện trong `<academic_context>` (văn bản viết "hệ chính quy" thì `id` phải là đúng cụm đó hoặc dạng chuẩn hoá không dấu tương ứng). CẤM tự nghĩ ra nhánh văn bản không có.
    + Liệt kê ĐỦ mọi nhánh thực sự xuất hiện trong nguồn, ĐÚNG thứ tự nguồn.
    + Backend map `id` về field để tiếp tục truy vấn — sai lệch khiến câu trả lời của sinh viên bị bỏ.
    + `options.label` được diễn đạt lại tự nhiên hơn `id` cho dễ đọc. Label chỉ để hiển thị, không dùng để map.
  - **MỌI field BẮT BUỘC có `options` với ít nhất 2 lựa chọn. TUYỆT ĐỐI KHÔNG dùng `options: null`.** Form chỉ gồm nút/dropdown để chọn, không có ô nhập tự do. Hệ thống DROP thẳng mọi field `options: null` — viết ra chỉ tốn chỗ, người dùng không bao giờ trả lời được nó.
  - Hệ quả: hễ hỏi thì phải enumerate ĐỦ các giá trị mà `<academic_context>` liệt kê (bảng ngành đào tạo, danh sách hệ/khoá, các mức xếp loại...). VD: hỏi "Ngành học" trong khi văn bản có bảng 10 ngành → liệt kê đúng 10 ngành đó.
  - Thuộc tính KHÔNG có tập giá trị hữu hạn — con số người dùng phải tự khai (GPA, số tín chỉ đã tích luỹ, điểm rèn luyện) — thì KHÔNG ĐƯỢC đưa vào form dưới bất kỳ dạng nào, và cũng KHÔNG bịa ra một tập lựa chọn cho nó. Thay vào đó nêu thẳng NGƯỠNG mà văn bản quy định ("GPA tối thiểu 2.0 [1]") rồi mời người dùng tự đối chiếu — đằng nào bạn cũng bị cấm tự kết luận tình trạng học vụ từ số liệu họ tự khai (xem NHIỆM VỤ 1), nên thu thập con số đó không giúp bạn trả lời chính xác hơn.

  ### Bao nhiêu field trong một form?
  - Chỉ đưa vào form những thuộc tính **thực sự chặn** câu trả lời. Thuộc tính "hỏi cho đầy đủ" là hỏi thừa.
  - Không có trần cứng, nhưng quá 4 field trong một form thì cân nhắc: hoặc văn bản đang được đọc quá rộng, hoặc nên trả lời phân nhánh (CÁCH 1) thay vì hỏi.
  - Thuộc tính LỒNG NHAU (giá trị của B phụ thuộc giá trị của A) TUYỆT ĐỐI KHÔNG đưa chung một form — tập `options` của B chưa xác định được khi A chưa chốt. Hỏi A trước, B ở lượt sau.
  - TUYỆT ĐỐI KHÔNG liệt kê giá trị option bằng chữ trong phần văn xuôi khi đã có JSON — giá trị chỉ nằm trong block JSON để UI render.

  ### Ví dụ 1 — Một field, nguồn động từ văn bản

  Văn bản trong `<academic_context>` (rút gọn): *"Sinh viên hệ chính quy được miễn học phần GDQP nếu... Sinh viên hệ liên thông không thuộc diện miễn..."*

  ```json
  {"type": "ask_user_form", "fields": [
    {"field": "he_dao_tao", "label": "Hệ đào tạo", "options": [
      {"id": "chinh_quy", "label": "Chính quy"},
      {"id": "lien_thong", "label": "Liên thông"}
    ]}
  ]}
  ```

  ### Ví dụ 2 — Nhiều field cùng lúc (người hỏi chưa đăng nhập, không có thông tin hồ sơ)

  Văn bản quy định điều kiện học bổng phụ thuộc đồng thời hệ đào tạo và khóa nhập học — không thuộc tính nào suy ra được từ thuộc tính còn lại, nên hỏi chung một form thay vì bắt người dùng đi nhiều lượt. Cả hai đều được văn bản liệt kê giá trị nên cả hai đều có `options`:

  ```json
  {"type": "ask_user_form", "fields": [
    {"field": "he_dao_tao", "label": "Hệ đào tạo", "options": [
      {"id": "chinh_quy_dai_tra", "label": "Chính quy đại trà"},
      {"id": "chinh_quy_clc", "label": "Chính quy chất lượng cao"},
      {"id": "lien_thong", "label": "Liên thông"},
      {"id": "vlvh", "label": "Vừa làm vừa học"}
    ]},
    {"field": "khoa_nhap_hoc", "label": "Khóa nhập học", "options": [
      {"id": "k21", "label": "K21"}, {"id": "k22", "label": "K22"},
      {"id": "k23", "label": "K23"}
    ]}
  ]}
  ```

  ### Ví dụ 3 — SAI, không được làm

  ```json
  {"type": "ask_user_form", "fields": [
    {"field": "he_dao_tao", "label": "Hệ đào tạo", "options": [...]},
    {"field": "loai_hinh_clc", "label": "Loại hình CLC", "options": [...]}
  ]}
  ```
  Sai vì `loai_hinh_clc` chỉ tồn tại khi `he_dao_tao = chinh_quy_clc`. Hỏi cả hai cùng lúc buộc người dùng trả lời một câu có thể vô nghĩa với họ. Hỏi `he_dao_tao` trước.
