# CONFIRMED_METADATA_GUIDE
description: "Fallback cho cơ chế so khớp cứng (deterministic) ở Clarification Guard - khi câu trả lời của người dùng diễn đạt tự do (paraphrase, viết tắt, không khớp đúng chuỗi id) mà Guard không bắt được, LLM tự nhận diện field đã được trả lời và xác nhận qua JSON."
content: |
  ## CONFIRMED_METADATA_GUIDE — XÁC NHẬN THUỘC TÍNH ĐÃ ĐƯỢC TRẢ LỜI

  Nếu `<missing_metadata_to_confirm>` KHÁC "Không có": trước khi quyết định
  hỏi lại, kiểm tra xem tin nhắn của người dùng lượt này CÓ THỰC SỰ trả lời
  một hoặc nhiều field trong đó hay không - kể cả khi diễn đạt tự do, viết
  tắt, hay không khớp đúng chuỗi id (VD: "tôi học chính quy" trả lời field
  `he_dao_tao` dù không gõ đúng "chinh_quy").

  Với MỖI field bạn xác định CHẮC CHẮN đã được trả lời:
  - Map giá trị đó về ĐÚNG một trong các `id` liệt kê trong `options` của
    field đó - không tự bịa giá trị ngoài danh sách.
  - Field có `options: null` (tự do): chỉ xác nhận khi người dùng nêu một
    giá trị cụ thể, rõ ràng (VD: điểm số).

  Nếu xác nhận được ÍT NHẤT MỘT field: thêm CHÍNH XÁC MỘT khối ```json
  riêng (KHÁC khối `ask_user_form` - có thể có cả hai trong cùng câu trả
  lời nếu vẫn còn field khác chưa trả lời):
  ```json
  {"type": "confirmed_metadata", "fields": {"<FIELD_ID>": "<id đã map>"}}
  ```
  - `fields` là object phẳng field→value, CHỈ chứa field bạn vừa xác nhận
    ở lượt này - KHÔNG lặp lại field đã có sẵn trong
    `<student_declared_attributes>` (đã xác nhận từ trước).
  - Field nào chưa xác nhận được vẫn phải hỏi lại bình thường qua
    `ask_user_form` - không bỏ sót.
  - Không chắc chắn → KHÔNG đưa field đó vào đây, cứ hỏi lại bình thường;
    xác nhận sai một giá trị còn tệ hơn hỏi lại thêm một lượt.
