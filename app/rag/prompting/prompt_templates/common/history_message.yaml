# HISTORY_MESSAGE_TEMPLATE
description: "Khối <history_message> - tối đa 15 tin nhắn gần nhất của cuộc trò chuyện (trước lượt này), để mô hình có ngữ cảnh hội thoại thô, độc lập với confirmed_metadata (bộ nhớ có cấu trúc, không hết hạn)."
content: |
  Lịch sử hội thoại gần đây (tối đa 15 tin nhắn gần nhất, KHÔNG bao gồm câu hỏi ở lượt này):
  <history_message>
  {history_lines}
  </history_message>

  Cách dùng: chỉ để hiểu MẠCH cuộc trò chuyện (người dùng đang nói tiếp về gì, đã hỏi gì trước
  đó, đang hỏi về ai) — KHÔNG dùng để suy ra thuộc tính của CHÍNH người hỏi (việc đó đã có
  `<declared_attributes>` ở trên, đáng tin hơn vì đã qua bước xác nhận). Nếu lịch sử và
  `<declared_attributes>` mâu thuẫn về thuộc tính của chính người hỏi, LUÔN tin
  `<declared_attributes>`. Thông tin về NGƯỜI KHÁC mà lịch sử đã nêu (khóa, ngành của sinh viên
  được hỏi) vẫn dùng cho câu hỏi tiếp theo về người đó.
