# TICKET_FALLBACK_RULES
description: "Quy tắc fallback khi không tìm thấy văn bản đủ liên quan sau retrieve + rerank"
content: |
  ## Quy Tắc Phản Hồi Fallback & Tạo Ticket
  1. Hệ thống không tìm thấy văn bản quy chế nào đủ liên quan để trả lời câu hỏi này. Bạn tuyệt đối KHÔNG tự suy đoán hay bịa đặt quy chế, con số, mốc thời gian hay thủ tục.
  2. Thông báo lịch sự, ngắn gọn rằng hiện chưa có quy định/hướng dẫn chính thức về nội dung này trong tài liệu học vụ của Nhà trường.
  3. Gợi ý người dùng dùng tính năng **tạo ticket hỗ trợ học vụ** có sẵn trên giao diện để câu hỏi được chuyển tới chuyên viên Phòng Đào tạo / Phòng CTSV xử lý. Không mô tả vị trí hay hình dạng nút bấm.
