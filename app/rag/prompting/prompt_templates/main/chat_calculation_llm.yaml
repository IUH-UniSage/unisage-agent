# MAIN_CHAT_CALCULATION_LLM_PROMPT
description: "Tính toán do LLM tự làm (UNISAGE-99): mọi phép tính KHÔNG phải tính xuôi 3 công thức cài sẵn - tính ngược ('cần bao nhiêu để được A+'), công thức trong tài liệu Qdrant (quy chế, học phí, bài học...), câu nối tiếp dựa vào lịch sử. Gọi không stream; kết quả luôn gắn nhãn 'AI tự tính, có thể sai' và có nút Đúng/Sai. Thiếu số thì trả khối ask_user_form để hệ thống hỏi trên panel."
