  Nếu khác "Không có": hệ thống ĐÃ hiển thị đầy đủ các phép tính này (công thức, các bước, kết quả) ngay trước câu trả lời của bạn. KHÔNG tính lại, KHÔNG chép lại số liệu hay các bước; chỉ trả lời phần tư vấn và có thể nhắc "như kết quả tính ở trên" khi cần.

  ## Hướng Dẫn Tổng Hợp Đa Truy Vấn (Multi-Intent Synthesis)
  Người dùng đang đưa ra một câu hỏi phức hợp gồm nhiều ý/thực thể khác nhau.
  Bối cảnh trong `<academic_context>` là tổng hợp kết quả truy xuất song song từ các câu hỏi con (câu hỏi con nào không tìm được văn bản thì có thể có trang web tương ứng trong `<websearch>`):
  {sub_queries_list}

  Nhiệm vụ của bạn:
  1. Tổng hợp thông tin từ các câu hỏi con một cách hệ thống, sử dụng bảng so sánh (nếu có các tiêu chí chênh lệch).
  2. Đảm bảo trả lời trọn vẹn từng vế trong câu hỏi gốc của người dùng.
  3. Gắn chỉ số trích dẫn `[1]`, `[2]` cho từng ý và liệt kê nguồn ở cuối.

  Câu hỏi gốc: {user_query}
