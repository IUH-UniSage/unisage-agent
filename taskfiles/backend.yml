version: '3'

tasks:
  dev:
    desc: "Chạy FastAPI dev server qua uv run uvicorn"
    dotenv: ['.env.{{.env}}', '.env']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - '{{.UV_RUN}} uvicorn app.main:app --reload --host {{.HOST}} --port {{.PORT}} {{.CLI_ARGS}}'

  prod:
    desc: "Chạy FastAPI production server qua gunicorn / uvicorn workers"
    dotenv: ['.env.{{.env}}', '.env']
    cmds:
      - '{{.UV_RUN}} gunicorn -w ${WORKERS:-4} -k uvicorn.workers.UvicornWorker -b {{.HOST}}:{{.PORT}} app.main:app'

  worker:
    desc: "Chạy Celery worker (ingestion, usage outbox drain, budget reconciliation)"
    dotenv: ['.env.{{.env}}', '.env']
    cmds:
      - '{{.UV_RUN}} celery -A app.worker.celery_app worker --loglevel=info {{.CLI_ARGS}}'

  worker:ingest:
    desc: "Celery worker chỉ nhận embedding (queue <prefix>-ingestion). Vd task be:worker:ingest env=eval -- --pool=solo -n ingest1@%h"
    dotenv: ['.env.{{.env}}', '.env']
    cmds:
      - '{{.UV_RUN}} celery -A app.worker.celery_app worker --loglevel=info -Q "${CELERY_QUEUE_PREFIX:-unisage}-ingestion" {{.CLI_ARGS}}'

  worker:default:
    desc: "Celery worker cho xác minh credential + task Beat (queue <prefix>-default). Vd task be:worker:default env=eval -- --pool=solo -n default@%h"
    dotenv: ['.env.{{.env}}', '.env']
    cmds:
      - '{{.UV_RUN}} celery -A app.worker.celery_app worker --loglevel=info -Q "${CELERY_QUEUE_PREFIX:-unisage}-default" {{.CLI_ARGS}}'

  beat:
    desc: "Chạy Celery beat scheduler (drain_usage_outbox, release_expired_reservations, reconcile_budget_committed, ...)"
    dotenv: ['.env.{{.env}}', '.env']
    cmds:
      - '{{.UV_RUN}} celery -A app.worker.celery_app beat --loglevel=info {{.CLI_ARGS}}'
