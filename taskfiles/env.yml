version: '3'

tasks:
  show:
    desc: "In DB / bucket / collection / Redis mà env đang trỏ tới (vd task env:show env=eval)"
    dotenv: ['.env.{{.env}}', '.env']
    silent: true
    cmds:
      # DB_URL has the password in it: print only the part after '@'.
      - |
        echo "env={{.env}}  APP_ENV=${APP_ENV:-development}"
        echo "DB                = ${DB_URL#*@}"
        echo "MINIO_BUCKET      = ${MINIO_BUCKET}"
        echo "QDRANT_COLLECTION = ${QDRANT_COLLECTION}"
        echo "REDIS_URL         = ${REDIS_URL#*@}"
        echo "CELERY_BROKER_URL = ${CELERY_BROKER_URL#*@}  (queue prefix ${CELERY_QUEUE_PREFIX:-unisage})"
