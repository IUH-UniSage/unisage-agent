[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unisage-agent"
version = "0.1.0"
description = "UniSage AI Agent Service - Python FastAPI + Pydantic Graph RAG Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[openai,anthropic]>=1.0.0",
    "pydantic-graph>=1.80.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "tiktoken>=0.7.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf4llm>=0.0.1",
    "minio>=7.2.0",
    "celery[redis]>=5.4.0",
    "qdrant-client>=1.12.0",
    "openai>=1.55.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-openpyxl>=3.1.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pymupdf4llm", "celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery ships without inline type annotations, so `@celery_app.task` is seen
# as an untyped decorator under strict mode; relax that check just here.
module = "app.worker.celery_app"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pymupdf/pymupdf4llm ship without inline type annotations; these modules are
# the only ones that touch that API directly, so relax untyped-call checking
# just here.
module = [
    "app.rag.ingestion.parser",
    "app.rag.ingestion.table_aware_parser",
    "tests.fixtures.documents",
]
disallow_untyped_calls = false
