# Simulated access labels for the crawled IUH PDFs (Task 6).
#
# Every crawled document is public on the web; `is_public=false` + `access_level`
# are assigned here only so the evaluation can measure permission leakage.
# The report must say the labels are simulated.
#
# `department` is the department *code* seeded by unisage-backend
# (`DataInitializer.seedDepartments()`, column `departments.name`); the runtime
# `department_id` is that row's UUID, resolved at ingest time (Task 7).

seed: 30092026
# Share of each department's documents turned private (at least one when the
# department has two or more documents in the group).
private_ratio: 0.3
# Levels drawn for private documents. 0 ("no limit") is excluded so every
# private document has a "one level too low" persona; 5 is left for admins.
private_levels: [1, 2, 3, 4]

# Copied from DataInitializer.seedDepartments(); label.py rejects any other code.
known_departments:
