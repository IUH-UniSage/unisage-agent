# Từ vựng chuẩn hóa `subject` trước khi dựng câu truy vấn web
# (app/rag/web_query.py::build_web_query). Đây là tầng BẢO VỆ: prompt phân loại
# (message_classification_retrieval.yaml, mục `web`) đã yêu cầu model viết `subject` bằng
# thuật ngữ chuẩn; file này chỉ sửa khi model vẫn viết lệch.
#
# Vì sao cần: câu truy vấn là khóa của cache Tavily. "học phí" và "mức thu học phí" của
# cùng một câu hỏi (16-10-2026) thành hai lần tìm, hai bộ trang khác nhau.
#
# NGUYÊN TẮC GỘP: gộp các cách nói của CÙNG MỘT yêu cầu tìm CÙNG MỘT loại văn bản; giữ
# riêng những yêu cầu dẫn tới văn bản khác nhau:
#   - mức thu / đơn giá        -> quyết định mức thu học phí
#   - hạn / lịch đóng          -> thông báo đóng học phí theo học kỳ
#   - cách / hình thức đóng    -> hướng dẫn nộp tiền
#   - điều kiện / tiêu chuẩn   -> quy chế, quy định
#   - thủ tục / hồ sơ          -> thông báo, biểu mẫu
# Ví dụ "học lại" và "học cải thiện", "bảo lưu" và "thôi học" là các thủ tục khác nhau,
# không gộp.
#
# Thứ tự áp dụng (mọi khóa viết CHỮ THƯỜNG; khớp nguyên từ, không phân biệt hoa thường):
#   1. spelling       - chính tả và vị trí dấu ("kì" -> "kỳ", "khoá" -> "khóa"), mọi chỗ.
#   2. abbreviations  - viết tắt và cách ghi học kỳ -> chữ đầy đủ, mọi chỗ ("hk1", "đkhp").
#   3. phrase_aliases - cụm đồng nghĩa NHIỀU TỪ, thay ở bất kỳ đâu trong subject (subject
#                       thường kèm học kỳ: "lịch thi cuối kỳ học kỳ I"); chạy sau bước 2 nên
#                       khóa viết dạng đầy đủ ("thời gian đăng ký học phần", không "đkhp").
#      Bước 1-3 thay nguyên từ, cụm dài trước, mỗi bước một lượt. Chỉ thêm cụm không thể là
#      phần đầu của một từ ghép khác: KHÔNG thêm "tiền học" (sẽ phá "tiền học bổng") hay
#      "đk" (vừa là "đăng ký" vừa là "điều kiện"). Khóa là phần đầu của chính dạng chuẩn
#      ("tạm dừng học" -> "tạm dừng học tập") cần thêm dạng chuẩn làm khóa của chính nó.
#   4. (code) bỏ ngành/bậc/hệ/cơ sở đã có ô riêng.
#   5. subject_aliases - cách gọi trống/mơ hồ, chỉ khi khớp NGUYÊN subject còn lại, theo
#                        topic rồi `_all`. Khóa viết theo dạng ĐÃ qua bước 1-3 (vd "kỳ", không
#                        "kì"; "thời khóa biểu", không "tkb").
# Dạng chuẩn: thuật ngữ văn bản chính thức của Trường dùng (tiêu đề thông báo, quy chế).

# Giá trị mặc định của ô bậc/hệ: KHÔNG ghi vào câu truy vấn. Câu không nêu bậc được hiểu là
# đại học chính quy (bộ chấm trang web cũng hiểu vậy, trang sau đại học bị lọc riêng), nên
# model điền "Đại học" hay để trống thì câu truy vấn vẫn như nhau: "ngành công nghệ tt học
# phí 1 năm" được điền "Đại học" dù người hỏi không nói (16-10-2026), thành entry cache thứ
# hai "mức thu học phí Đại học IUH". So sánh theo tên chuẩn (`_ALIASES` trong web_query.py).
