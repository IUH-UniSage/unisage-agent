version: '3'

vars:
  # Môi trường chạy: dev (mặc định) | eval | prod. Mọi task chạy app/worker/migration nạp
  # `.env.<env>` trước rồi `.env`: file đứng trước thắng, biến đã có trong shell thắng cả hai.
  # Vd `task be:dev env=eval`. Quy ước tên DB/bucket/collection: changes/.../spec.md §12.7 (backend).
  env: '{{.env | default "dev"}}'

  # Python environment runner (uses project .venv) - the venv layout differs per OS.
  UV_RUN: '{{if eq OS "windows"}}.venv/Scripts/python{{else}}.venv/bin/python{{end}} -m'

  # Host & Port defaults for Windows/POSIX compatibility - sourced from
  # .env's APP_HOST/APP_PORT (see taskfiles/backend.yml's dotenv), not
  # Settings: no code in app/ needs to know its own bind address.
  HOST: '{{.APP_HOST | default "127.0.0.1"}}'
  PORT: '{{.APP_PORT | default "8402"}}'

  # backend-java checkout next to this repo (named backend-java or unisage-backend); override
  # with BACKEND_DIR=... when it lives elsewhere. Used by `task db:up` for Postgres + MinIO.
  BACKEND_DIR:
    sh: 'if [ -n "$BACKEND_DIR" ]; then echo "$BACKEND_DIR"; elif [ -d ../backend-java ]; then echo ../backend-java; else echo ../unisage-backend; fi'

  # ANSI Color Codes
  COLOR_RESET: '\033[0m'
  COLOR_BOLD_WHITE: '\033[1;37m'
  COLOR_BOLD_YELLOW: '\033[1;33m'
  COLOR_CYAN: '\033[1;36m'
  COLOR_GREEN: '\033[0;32m'
  COLOR_GRAY: '\033[0;90m'

  # Box Drawing Characters
  BOX_TOP: '╔═══════════════════════════════════════════════════════════════════'
  BOX_MID: '╠═══════════════════════════════════════════════════════════════════'
  BOX_BTM: '╚═══════════════════════════════════════════════════════════════════'
  BOX_LINE: '║'

includes:
  help:
    taskfile: ./taskfiles/help.yml
    optional: false

  be:
    taskfile: ./taskfiles/backend.yml
    optional: false

  code:
    taskfile: ./taskfiles/code.yml
    optional: false

  test:
    taskfile: ./taskfiles/test.yml
    optional: false

  db:
    taskfile: ./taskfiles/db.yml
    optional: false

  usage:
    taskfile: ./taskfiles/usage.yml
    optional: false

  env:
    taskfile: ./taskfiles/env.yml
    optional: false

  eval:
    taskfile: ./taskfiles/eval.yml
    optional: false

tasks:
  default:
    desc: "Hiển thị menu help với các nhóm task"
    cmds:
      - task: help:help
    silent: true
